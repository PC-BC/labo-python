<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Labo Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root{
    --line:#dcdcdc; --ink:#333; --muted:#888; --tabbar:#f2f2f2; --tab-off:#e4e4e4;
    --fs:15px; --split:58%;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  .cell:has(> button[hidden]){display:none}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;background:#fff}
  button{font:inherit;cursor:pointer;color:var(--ink)}

  /* ----- barre d'outils (cases séparées par des traits, comme trinket) ----- */
  #bar{display:flex;align-items:stretch;height:42px;border-bottom:1px solid var(--line);background:#fff;flex:none;position:relative;z-index:20}
  .cell{position:relative;display:flex;align-items:stretch;border-right:1px solid var(--line)}
  .cell.right{border-right:none;border-left:1px solid var(--line)}
  .cell > button{background:none;border:none;padding:0 16px;font-size:19px;display:flex;align-items:center;gap:6px}
  .cell > button:hover{background:#f2f2f2}
  .cell > button:disabled{opacity:.35;cursor:default;background:none}
  .cell > button.small{padding:0 12px;font-size:13px}
  .cell > button.txt{font-size:17px}
  .logo{padding:0 12px;font-size:22px;display:flex;align-items:center}
  #btnRun{font-size:21px;min-width:58px;justify-content:center}
  #btnRun.stop{color:#c9302c}
  .spacer{flex:1}
  #status{align-self:center;font-size:12px;color:var(--muted);padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status.busy{color:#b07800}
  #status.err{color:#c9302c}
  .drop{position:absolute;top:100%;left:-1px;margin-top:1px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.15);min-width:240px;padding:4px 0;z-index:30}
  .drop[hidden]{display:none}
  .drop > button, .drop .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:9px 16px;font-size:14px;white-space:nowrap}
  .drop > button:hover{background:#f2f2f2}
  .drop hr{border:none;border-top:1px solid var(--line);margin:4px 0}
  .drop .mi input, .drop .mi select{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .drop .mi button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:2px 10px}
  .ico{width:18px;text-align:center;color:#555}

  /* ----- bandeau exercice / correction ----- */
  #banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 12px;font-size:13px;flex:none}
  #banner[hidden]{display:none}
  #banner.ex{background:#eaf3fc;border-bottom:1px solid #c6dcf2}
  #banner.corr{background:#eaf7ec;border-bottom:1px solid #c0e3c6}
  #banner button{padding:3px 10px;font-size:12px;border:1px solid var(--line);border-radius:3px;background:#fff}

  /* ----- zone code | résultat ----- */
  main{flex:1;display:grid;grid-template-columns:var(--split) 7px 1fr;min-height:0}
  section{display:flex;flex-direction:column;min-height:0;min-width:0}
  .tabbar{display:flex;align-items:flex-end;background:var(--tabbar);border-bottom:1px solid var(--line);height:44px;padding:0 6px;gap:4px;flex:none}
  .tabbar > button{background:none;border:none;font-size:17px;padding:0 8px;height:36px;align-self:center;color:#444}
  .tabbar > button:hover{color:#000}
  #tabs{display:flex;gap:3px;overflow-x:auto;align-self:stretch;align-items:flex-end}
  .tab{display:flex;align-items:center;gap:6px;padding:8px 12px 7px;background:var(--tab-off);color:#555;font-size:15px;border-top:3px solid transparent;cursor:pointer;white-space:nowrap;user-select:none}
  .tab.on{background:#fff;color:#222;border-top-color:#111}
  .tab .x{border:none;background:none;color:#999;font-size:14px;padding:0 0 0 2px;line-height:1}
  .tab .x:hover{color:#c9302c}
  #editorPane .CodeMirror{flex:1;height:auto;font-family:"Source Code Pro",Consolas,Menlo,"Courier New",monospace;font-size:var(--fs);line-height:1.45}
  .CodeMirror-gutters{background:#f7f7f7;border-right:none}
  .CodeMirror-linenumber{color:#999;padding:0 10px 0 8px}
  .CodeMirror-activeline-background{background:#ececec}
  .CodeMirror-activeline-gutter{background:#e2e2e2}
  .cm-s-default .cm-comment{color:#0a8a0a}
  .cm-s-default .cm-keyword{color:#b500b5}
  .cm-s-default .cm-string{color:#d11}
  .cm-s-default .cm-number{color:#3030c0}
  .cm-s-default .cm-builtin{color:#3030c0}
  .cm-s-default .cm-def,.cm-s-default .cm-variable,.cm-s-default .cm-property,.cm-s-default .cm-operator{color:#111}
  .CodeMirror.ro{background:#fbfdfb}
  .CodeMirror.ro .CodeMirror-cursor{display:none!important}
  #splitter{background:#f0f0f0;border-left:1px solid var(--line);border-right:1px solid var(--line);cursor:col-resize;position:relative}
  #splitter::after{content:"";position:absolute;top:50%;left:2px;width:1px;height:30px;margin-top:-15px;border-left:1px solid #bbb;border-right:1px solid #bbb;width:1px}
  body.codeHidden main{grid-template-columns:44px 0 1fr}
  body.codeHidden #tabs, body.codeHidden #btnAddFile, body.codeHidden #btnUpload, body.codeHidden #editorPane .CodeMirror, body.codeHidden #splitter{display:none}
  body.codeHidden .tabbar{padding:0;justify-content:center}

  #resultPane{background:#fff}
  #output{flex:1;overflow:auto;padding:12px 14px;color:#222;font-family:"Source Code Pro",Consolas,Menlo,monospace;font-size:var(--fs);line-height:1.45;white-space:pre-wrap;word-break:break-word}
  #output .err{display:block;background:#fdecea;border-left:4px solid #c9302c;color:#a12a20;padding:6px 10px;margin:6px 0}
  #output .saisie{color:#1b6ec2}
  #output .prompt{color:var(--muted)}
  #output .info{color:var(--muted);font-style:italic}
  #output img{display:block;max-width:100%;margin:6px auto}
  #output .turtle{display:block;margin:4px auto;width:max-content;max-width:100%}
  #output .saisieInline{border:none;border-bottom:1px solid #1b6ec2;background:#f2f7fd;color:#1b6ec2;font:inherit;padding:0 4px;min-width:12em;outline:none}
  #repl{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);background:#fafafa;font-family:"Source Code Pro",Consolas,Menlo,monospace;font-size:calc(var(--fs) - 1px);color:var(--muted);flex:none}
  #replInput{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:inherit}

  /* ----- fenêtre Partager / Intégrer ----- */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #modal[hidden]{display:none}
  .card{background:#fff;border-radius:6px;max-width:640px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .card h2{margin:0 0 6px;font-size:18px;font-weight:600}
  .card p{margin:6px 0;color:#666;font-size:14px}
  .card textarea{width:100%;height:90px;font-family:Consolas,Menlo,monospace;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:3px;resize:vertical}
  .card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .card button{border:1px solid var(--line);border-radius:3px;padding:7px 14px;background:#fff}
  .card button.primary{background:#2d7be5;border-color:#2d7be5;color:#fff;font-weight:600}
  .warn{color:#c9302c!important}

  #keys,#mnav{display:none}
  /* ----- téléphone : une seule zone à la fois (Code / Résultat) ----- */
  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:1fr}
    #splitter{display:none}
    body.vueResult #editorPane{display:none}
    body:not(.vueResult) #resultPane{display:none}
    .logo,#btnToggleCode,#btnReset2 .lbl{display:none}
    #bar{height:44px}
    .cell > button{padding:0 13px}
    #status{max-width:34vw;padding:0 6px;font-size:11px}
    #btnRemix{font-size:14px}
    .tabbar{height:40px}
    .tab{padding:7px 10px 6px;font-size:14px}
    #banner{font-size:12px;padding:5px 8px}
    .drop{max-width:calc(100vw - 8px)}
    #output{padding:10px}
    #mnav{display:flex;border-top:1px solid var(--line);background:#f6f6f6;flex:none}
    #mnav button{flex:1;border:none;background:none;padding:11px 6px;font-size:15px;color:#777;border-top:3px solid transparent}
    #mnav button.on{color:#111;border-top-color:#111;background:#fff;font-weight:600}
    #keys{display:flex;gap:5px;overflow-x:auto;padding:5px 6px;background:#ececec;border-top:1px solid var(--line);flex:none;-webkit-overflow-scrolling:touch}
    #keys button{flex:none;min-width:42px;height:38px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;font-family:"Source Code Pro",Consolas,monospace;font-size:17px;padding:0 8px;touch-action:manipulation}
    #keys button:active{background:#dde8f7}
    body.lectureSeule #keys{display:none}
  }
</style>
</head>
<body>
<header id="bar">
  <div class="cell">
    <button id="btnMenu" title="Menu">☰</button>
    <div id="menu" class="drop" hidden>
      <button id="btnReset" hidden><span class="ico">↺</span>Repartir de l'énoncé</button>
      <button id="btnNew"><span class="ico">📄</span>Nouveau programme</button>
      <div class="mi"><span class="ico">📚</span>Exemples <select id="exemples"><option value="">choisir…</option></select></div>
      <div class="mi"><span class="ico">✎</span>Titre <input id="titre" placeholder="Sans titre" maxlength="80"></div>
      <hr>
      <button id="btnOpen"><span class="ico">📂</span>Ouvrir un fichier .py (remplace main.py)</button>
      <button id="btnDownload"><span class="ico">⬇</span>Télécharger le fichier affiché</button>
      <hr>
      <button id="btnFull"><span class="ico">⛶</span>Plein écran</button>
      <div class="mi"><span class="ico">A</span>Taille du texte <span class="spacer"></span><button id="btnSmaller">A−</button><button id="btnBigger">A+</button></div>
    </div>
  </div>
  <div class="cell logo" title="Labo Python">🐍</div>
  <div class="cell"><button id="btnRun" disabled title="Exécuter (Ctrl + Entrée)">▶</button></div>
  <div class="cell">
    <button id="btnRunMenu" class="small" title="Options d'exécution">▼</button>
    <div id="runMenu" class="drop" hidden>
      <button data-act="run"><span class="ico">▶</span>Exécuter <span class="spacer"></span><small style="color:#999">Ctrl+Entrée</small></button>
      <button data-act="stop"><span class="ico">■</span>Arrêter</button>
      <button data-act="clear"><span class="ico">🧹</span>Effacer le résultat</button>
      <button data-act="reset" id="btnReset3" hidden><span class="ico">↺</span>Réinitialiser (revenir à l'énoncé)</button>
    </div>
  </div>
  <div class="cell">
    <button id="btnShare" title="Partager (lien)">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" fill="#333"/><circle cx="6" cy="12" r="3" fill="#333"/><circle cx="18" cy="19" r="3" fill="#333"/><path d="M8.6 10.7l6.8-4M8.6 13.3l6.8 4" stroke="#333" stroke-width="2"/></svg>
    </button>
  </div>
  <div class="cell">
    <button id="btnShareMenu" class="small" title="Options de partage">▼</button>
    <div id="shareMenu" class="drop" hidden>
      <button id="btnLink"><span class="ico">🔗</span>Lien de partage</button>
      <button id="btnEmbed"><span class="ico">&lt;/&gt;</span>Intégrer dans une page (Embed)</button>
      <button id="btnDownload2"><span class="ico">⬇</span>Télécharger le fichier .py</button>
    </div>
  </div>
  <div class="cell"><button id="btnReset2" class="txt" hidden title="Effacer mes modifications et revenir à l'énoncé de départ">↺<span class="lbl"> Réinitialiser</span></button></div>
  <span class="spacer"></span>
  <span id="status" class="busy">Chargement…</span>
  <div class="cell right"><button id="btnRemix" class="txt" hidden title="Créer ma propre copie modifiable">💾 Ma copie</button></div>
  <input type="file" id="fileInput" accept=".py,.txt,.csv,text/x-python,text/plain" hidden>
  <input type="file" id="fileAdd" accept=".py,.txt,.csv,text/x-python,text/plain" hidden>
</header>

<div id="banner" hidden></div>

<main>
  <section id="editorPane">
    <div class="tabbar">
      <button id="btnToggleCode" title="Masquer / afficher le code">&lt; &gt;</button>
      <div id="tabs"></div>
      <span class="spacer"></span>
      <button id="btnAddFile" title="Nouveau fichier">✚</button>
      <button id="btnUpload" title="Ajouter un fichier depuis l'ordinateur">⇪</button>
    </div>
    <textarea id="code"></textarea>
    <div id="keys" aria-label="Touches pour Python">
      <button data-k="tab" title="Indenter">⇥</button><button data-k="untab" title="Désindenter">⇤</button>
      <button data-k=":">:</button><button data-k="()">( )</button><button data-k="[]">[ ]</button>
      <button data-k='""'>" "</button><button data-k="=">=</button><button data-k="#">#</button>
      <button data-k="+">+</button><button data-k="-">−</button><button data-k="*">*</button><button data-k="/">/</button>
      <button data-k="**">**</button><button data-k="<">&lt;</button><button data-k=">">&gt;</button><button data-k=",">,</button>
      <button data-k="left" title="Curseur à gauche">←</button><button data-k="right" title="Curseur à droite">→</button>
    </div>
  </section>
  <div id="splitter" title="Glisser pour redimensionner"></div>
  <section id="resultPane">
    <div id="output"></div>
    <div id="repl"><span>&gt;&gt;&gt;</span><input id="replInput" disabled placeholder="Console : tapez une instruction puis Entrée" autocomplete="off" spellcheck="false"></div>
  </section>
</main>
<nav id="mnav"><button id="navCode" class="on">📝 Code</button><button id="navResult">🖥️ Résultat</button></nav>

<div id="modal" hidden>
  <div class="card" role="dialog" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mInfo"></p>
    <textarea id="mLink" readonly></textarea>
    <p id="mWarn" class="warn" hidden></p>
    <div class="row">
      <button id="mCopy" class="primary">Copier</button>
      <button id="mClose">Fermer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script>
"use strict";
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const DRAFT_KEY = "laboPython.brouillon";
const FS_KEY = "laboPython.taille";
const SPLIT_KEY = "laboPython.split";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Exemples ---------- */
const EXEMPLES = [
  { titre: "Bonjour + input()", code:
`# Premier programme : afficher et demander une information
prenom = input("Quel est ton prénom ? ")
print("Bonjour", prenom, "!")

age = int(input("Quel âge as-tu ? "))
print("Dans 10 ans, tu auras", age + 10, "ans.")
` },
  { titre: "Boucle : °C → K", code:
`# Table de conversion degrés Celsius -> kelvins
print("θ (°C)   T (K)")
for theta in range(-20, 101, 20):
    T = theta + 273.15
    print(f"{theta:6d}   {T:7.2f}")
` },
  { titre: "Tortue : polygone régulier", code:
`import turtle

t = turtle.Turtle()
t.color("blue")
n = 6            # nombre de côtés
for i in range(n):
    t.forward(100)
    t.left(360 / n)
` },
  { titre: "Courbe : décroissance radioactive", code:
`import numpy as np
import matplotlib.pyplot as plt

N0 = 1000          # nombre initial de noyaux
t12 = 5.0          # demi-vie (en jours)
lam = np.log(2) / t12

t = np.linspace(0, 30, 200)
N = N0 * np.exp(-lam * t)

plt.plot(t, N, label="N(t)")
plt.axhline(N0/2, ls="--", color="gray")
plt.axvline(t12, ls="--", color="gray")
plt.xlabel("t (jours)")
plt.ylabel("N")
plt.title("Décroissance radioactive")
plt.grid(True)
plt.legend()
plt.show()
` },
  { titre: "Régression : loi d'Ohm", code:
`import numpy as np
import matplotlib.pyplot as plt

# Mesures (I en A, U en V)
I = np.array([0.00, 0.02, 0.04, 0.06, 0.08, 0.10])
U = np.array([0.00, 0.95, 2.05, 2.98, 4.02, 5.01])

a, b = np.polyfit(I, U, 1)      # modèle U = a*I + b
print(f"Modèle : U = {a:.1f} × I + {b:.2f}")
print(f"Résistance estimée : R ≈ {a:.0f} Ω")

plt.plot(I, U, "o", label="mesures")
plt.plot(I, a*I + b, "-", label="modèle linéaire")
plt.xlabel("I (A)")
plt.ylabel("U (V)")
plt.legend()
plt.grid(True)
plt.show()
` },
  { titre: "Chute libre (méthode d'Euler)", code:
`import matplotlib.pyplot as plt

g = 9.81      # m/s²
dt = 0.01     # pas de temps (s)
t, z, v = 0.0, 0.0, 15.0   # lancer vertical vers le haut à 15 m/s

T, Z = [t], [z]
while z >= 0:
    v = v - g * dt
    z = z + v * dt
    t = t + dt
    T.append(t)
    Z.append(z)

print(f"Durée du vol ≈ {t:.2f} s ; altitude max ≈ {max(Z):.2f} m")
plt.plot(T, Z)
plt.xlabel("t (s)")
plt.ylabel("z (m)")
plt.title("Lancer vertical")
plt.grid(True)
plt.show()
` },
];


/* ---------- Éditeur ---------- */
const editor = CodeMirror.fromTextArea($("code"), {
  mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
  matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true,
  spellcheck: false, autocorrect: false, autocapitalize: false,
  extraKeys: {
    "Tab": cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ", "end"),
    "Shift-Tab": cm => cm.indentSelection("subtract"),
    "Ctrl-Enter": () => run(), "Cmd-Enter": () => run(),
  },
});
const titreEl = $("titre"), out = $("output"), statusEl = $("status");

/* ---------- Fichiers du projet (onglets main.py, …) ---------- */
let files = [{ name: "main.py", content: "" }], cur = 0;
let mode = null, fichier = null, original = "", saveTimer = null, loading = false;
// mode : null (brouillon libre) | "code" (lien de partage) | "ex" (exercice) | "corr" (correction)

function syncCur() { files[cur].content = editor.getValue(); }
function projet() { syncCur(); return files.map(f => ({ name: f.name, content: f.content })); }
function codesPython() { syncCur(); return files.filter(f => f.name.endsWith(".py")).map(f => f.content).join("\n"); }
function afficher(i) {
  loading = true;
  cur = i;
  editor.setValue(files[i].content);
  editor.setOption("mode", files[i].name.endsWith(".py") ? "python" : "text/plain");
  editor.clearHistory();
  loading = false;
  renderTabs();
}
function setProjet(liste, titre) {
  files = liste.map(f => ({ name: f.name, content: f.content }));
  let m = files.findIndex(f => f.name === "main.py");
  if (m < 0) files.unshift({ name: "main.py", content: "" }); else if (m > 0) files.unshift(files.splice(m, 1)[0]);
  titreEl.value = titre || "";
  afficher(0);
}
function renderTabs() {
  const box = $("tabs"); box.textContent = "";
  files.forEach((f, i) => {
    const t = document.createElement("div");
    t.className = "tab" + (i === cur ? " on" : "");
    t.textContent = f.name;
    t.title = f.name;
    t.onclick = () => { if (i !== cur) { syncCur(); afficher(i); editor.focus(); } };
    if (i > 0 && mode !== "corr") {
      const x = document.createElement("button");
      x.className = "x"; x.textContent = "✕"; x.title = "Supprimer " + f.name;
      x.onclick = ev => {
        ev.stopPropagation();
        if (!window.confirm("Supprimer le fichier « " + f.name + " » de ce programme ?")) return;
        syncCur(); files.splice(i, 1); afficher(Math.min(cur, files.length - 1) === i ? 0 : (cur > i ? cur - 1 : cur)); onEdit();
      };
      t.appendChild(x);
    }
    box.appendChild(t);
  });
}
function nomFichierValide(n) { return /^[\w-]+\.(py|txt|csv)$/.test(n); }
function ajouterFichier(nom, contenu) {
  syncCur();
  const k = files.findIndex(f => f.name === nom);
  if (k >= 0) files[k].content = contenu; else files.push({ name: nom, content: contenu });
  afficher(k >= 0 ? k : files.length - 1);
  onEdit();
}
$("btnAddFile").onclick = () => {
  if (mode === "corr") return;

        errorCallback: () => {},

      }
      try { pyodide.runPython("_flush()"); } catch (_) {}
    } else {
      setStatus("Exécution…", "busy");

function b64url(u8) {
  let bin = ""; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64url(s) {

  const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u;
}
async function encodeCode(text) {
  const bytes = new TextEncoder().encode(text);
  if ("CompressionStream" in window) {
    try {
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "z" + b64url(new Uint8Array(await new Response(st).arrayBuffer()));
    } catch (e) {}
  }
  return "p" + b64url(bytes);
}
async function decodeCode(s) {
  const kind = s[0], bytes = fromB64url(s.slice(1));
  if (kind === "z") {
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new TextDecoder().decode(await new Response(st).arrayBuffer());
  }
  return new TextDecoder().decode(bytes);
}

function alerteLien(url) {
  if (location.protocol === "file:") return "⚠ Cette page est ouverte depuis votre ordinateur : le lien ne fonctionnera que chez vous. Mettez la page en ligne (GitHub Pages) pour obtenir un lien partageable.";
  if (url.length > 8000) return `⚠ Lien très long (${url.length} caractères) : il peut être tronqué par certaines messageries. Préférez le fichier .py pour les longs programmes.`;
  return "";
}
async function partagerLien() {
  const url = await adresseCourante(false);
  ouvrirModal("🔗 Lien de partage",
    mode === "ex" && !exerciceModifie() ? "Lien de l'exercice : chaque élève qui l'ouvre obtient l'énoncé et travaille sur sa propre copie."
    : mode === "ex" ? "Lien de VOTRE version modifiée : le programme est entièrement contenu dans ce lien. L'énoncé d'origine n'est pas modifié."
    : mode === "corr" ? "Lien de la correction (lecture seule)."
    : "Le code est entièrement contenu dans ce lien : quiconque l'ouvre retrouve le programme, peut l'exécuter et faire « Ma copie », sans toucher à votre version.",
    url, "Copier le lien", alerteLien(url));
}
$("btnShare").onclick = partagerLien;
$("btnLink").onclick = partagerLien;
$("btnEmbed").onclick = async () => {
  const url = await adresseCourante(true);
  const code = `<iframe src="${url}" width="100%" height="450" frameborder="0" allowfullscreen></iframe>`;
  ouvrirModal("</> Intégrer dans une page",
    "Collez ce code dans une page de l'ENT, de Moodle ou d'un site (en mode « HTML » / « code source »). Le labo s'affichera directement dans la page.",
    code, "Copier le code", alerteLien(url));
};
$("mCopy").onclick = async () => {
  try { await navigator.clipboard.writeText($("mLink").value); $("mCopy").textContent = "✓ Copié !"; }
  catch (e) { $("mLink").select(); document.execCommand && document.execCommand("copy"); $("mCopy").textContent = "✓ Copié (Ctrl+C sinon)"; }
};
$("mClose").onclick = () => { $("modal").hidden = true; };
$("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").hidden = true; });

/* ---------- Fichiers : ouvrir / télécharger / nouveau ---------- */
function telecharger() {
  syncCur();
  const f = files[cur];
  let nom = f.name;
  if (cur === 0 && titreEl.value.trim()) nom = titreEl.value.trim().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w-]+/g, "_") + ".py";
  const blob = new Blob([f.content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnDownload").onclick = telecharger;
$("btnDownload2").onclick = telecharger;
$("btnOpen").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  quitterFichier();
  setProjet([{ name: "main.py", content: await f.text() }], f.name.replace(/\.(py|txt)$/i, ""));
  clearConsole(); onEdit();
};
$("btnNew").onclick = () => {
  if (mode !== "ex" && codesPython().trim() && !window.confirm("Effacer le programme en cours ?")) return;
  quitterFichier();
  setProjet([{ name: "main.py", content: "" }], ""); clearConsole(); onEdit(); editor.focus();
};
const sel = $("exemples");
EXEMPLES.forEach((ex, i) => { const o = document.createElement("option"); o.value = i; o.textContent = ex.titre; sel.appendChild(o); });
sel.onchange = () => {
  const ex = EXEMPLES[sel.value]; sel.value = ""; fermerMenus(); if (!ex) return;
  quitterFichier();
  setProjet([{ name: "main.py", content: ex.code }], ex.titre); clearConsole(); onEdit();
};

/* ---------- Brouillon, liens, exercices et corrections ---------- */
const banner = $("banner");
function draftKey() { return mode === "ex" ? "laboPython.ex." + fichier : DRAFT_KEY; }
function saveDraft() {
  if (mode === "corr") return;
  try { localStorage.setItem(draftKey(), JSON.stringify({ files: projet(), titre: titreEl.value })); } catch (e) {}
}
function lireBrouillon(cle) {
  try {
    const d = JSON.parse(localStorage.getItem(cle));
    if (!d) return null;
    if (Array.isArray(d.files)) return d;
    if (typeof d.code === "string") return { files: [{ name: "main.py", content: d.code }], titre: d.titre };
  } catch (e) {}
  return null;
}
function retirerLien() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
function onEdit() {
  if (loading) return;
  if (mode === "code") { mode = null; retirerLien(); majRemix(); }
  clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 400);
}
function showBanner(html, cls) { banner.innerHTML = html; banner.className = cls; banner.hidden = false; editor.refresh(); }
function hideBanner() { document.body.classList.remove("lectureSeule"); banner.hidden = true; editor.setOption("readOnly", false); editor.getWrapperElement().classList.remove("ro"); editor.refresh(); }
function quitterFichier() {
  if (mode === "ex" || mode === "corr" || mode === "code") retirerLien();
  mode = null; fichier = null; hideBanner(); majRemix(); renderTabs();
}
function majRemix() {
  $("btnRemix").hidden = !(mode === "ex" || mode === "corr" || mode === "code");
  $("btnReset").hidden = $("btnReset2").hidden = $("btnReset3").hidden = mode !== "ex";
}
function reinitialiser() {
  if (mode !== "ex") return;
  if (!window.confirm("Effacer toutes vos modifications et revenir à l'énoncé de départ ?")) return;
  setProjet([{ name: "main.py", content: original }], titreEl.value);
  clearConsole();
  try { localStorage.removeItem(draftKey()); } catch (e) {}
  push("↺ Programme réinitialisé : voici l'énoncé de départ.\n", "info"); flush();
}
$("btnReset").onclick = reinitialiser;
$("btnReset2").onclick = reinitialiser;
function remix() {
  const p = projet(), t = titreEl.value, c = cur;
  quitterFichier();
  setProjet(p, t ? t + " (ma copie)" : ""); if (c) afficher(c);
  saveDraft();
  showBanner("<span>💾 <b>Ma copie</b> : c'est maintenant votre propre version, gardée sur cet appareil. Utilisez le bouton Partager pour l'envoyer.</span>", "ex");
  editor.focus();
}
$("btnRemix").onclick = remix;

function nomValide(n) { return /^[\w-]+(\/[\w-]+)*(\.py)?$/.test(n); }
async function chargerFichier(dossier, nom) {
  if (!nomValide(nom)) throw new Error("Nom de fichier invalide : " + nom);
  // « ex1 » → exercices/ex1.py ; « mon-dossier/ex1 » → mon-dossier/ex1.py (chemin depuis la racine du dépôt)
  const base = nom.includes("/") ? nom : dossier + "/" + nom;
  const essais = base.endsWith(".py") ? [base] : [base + ".py", base];
  for (const chemin of essais) {
    let r;
    try { r = await fetch(chemin, { cache: "no-cache" }); }
    catch (e) { throw new Error("Impossible de lire « " + chemin + " » (la page doit être en ligne, par ex. sur GitHub Pages)."); }
    if (r.ok) return await r.text();
  }
  throw new Error("Fichier introuvable : " + essais[0] + " (vérifiez le nom du dossier et du fichier, majuscules comprises).");
}
async function loadFromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  document.body.classList.toggle("embed", p.has("embed"));
  const ex = p.get("ex"), corr = p.get("corr"), code = p.get("code"), proj = p.get("projet");
  if (!ex && !corr && !code && !proj) return false;
  try {
    hideBanner();
    if (code || proj) {
      const liste = proj ? JSON.parse(await decodeCode(proj)) : [{ name: "main.py", content: await decodeCode(code) }];
      mode = "code"; fichier = null;
      setProjet(liste, p.get("titre") || "");
    } else if (ex) {
      original = await chargerFichier("exercices", ex);
      mode = "ex"; fichier = ex;
      const d = lireBrouillon(draftKey());
      const repris = d && (d.files.length > 1 || d.files[0].content !== original);
      setProjet(repris ? d.files : [{ name: "main.py", content: original }], "Exercice " + ex);
      if (repris) { push("Votre travail précédent a été repris. Pour revenir à l'énoncé de départ : bouton ↺ Réinitialiser.\n", "info"); flush(); }
    } else {
      const txt = await chargerFichier("corrections", corr);
      mode = "corr"; fichier = corr;
      setProjet([{ name: "main.py", content: txt }], "Correction " + corr);
      editor.setOption("readOnly", true);
      editor.getWrapperElement().classList.add("ro");
      document.body.classList.add("lectureSeule");
      showBanner(`<span>📖 <b>Correction ${esc(corr)}</b> — lecture seule. Vous pouvez l'exécuter avec ▶.</span><button id="bCopie">💾 Ma copie (modifiable)</button>`, "corr");
      $("bCopie").onclick = remix;
    }
    document.title = (titreEl.value ? titreEl.value + " – " : "") + "Labo Python";
    return true;
  } catch (e) {
    mode = null; fichier = null;
    push(String(e.message || e) + "\n", "err"); flush();
    return false;
  } finally { majRemix(); renderTabs(); }
}

/* ---------- Démarrage ---------- */
(async () => {
  if (!(await loadFromHash())) {
    const d = lireBrouillon(DRAFT_KEY);
    if (d && d.files.some(f => f.content.trim())) setProjet(d.files, d.titre);
    else setProjet([{ name: "main.py", content: EXEMPLES[0].code }], "");
  }
  editor.on("change", onEdit);
  titreEl.addEventListener("input", onEdit);
  window.addEventListener("hashchange", async () => { if (await loadFromHash()) clearConsole(); });
  etatRun(false, false);
  $("replInput").disabled = false;
  chargerLeger().then(() => setStatus("")).catch(() => setStatus("Hors ligne ?", "err"));
})();
</script>
